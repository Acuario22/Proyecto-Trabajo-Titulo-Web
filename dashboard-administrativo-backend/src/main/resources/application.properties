spring.application.name=dashboard-administrativo-backend
server.port=8080

# Configuración de Conexión a Base de Datos MySQL
# Reemplaza los placeholders con la URL y credenciales de tu instancia local de MySQL
spring.datasource.url=jdbc:mysql://<TU_HOST>:<TU_PUERTO>/BD_REPORTES_URBANOS?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=<TU_USUARIO_MYSQL>
spring.datasource.password=<TU_CONTRASENA_MYSQL>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Evita la serialización de proxies lazy de Hibernate en las respuestas JSON
# (causa raíz del HTTP 500 en /v3/api-docs cuando se exponen entidades JPA)
spring.jackson.serialization.fail-on-empty-beans=false

# Logs
logging.level.com.gestionreportes.dashboard=DEBUG

# Swagger / OpenAPI 3
# springdoc-openapi-starter-webmvc-ui 2.7.x es compatible con Spring Boot 3.4.x
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Excluye los actuator endpoints del spec de OpenAPI para reducir ruido
springdoc.paths-to-exclude=/actuator/**

server.error.include-message=always
server.error.include-exception=true

# =======================================================
# Integración con Microservicio de Machine Learning (FastAPI)
# =======================================================
ml.service.base-url=http://localhost:8000
ml.service.connect-timeout-ms=3000
ml.service.read-timeout-ms=5000
ml.service.fallback-categoria=PAVIMENTACION
ml.service.fallback-sentimiento=NEUTRAL
ml.service.fallback-urgencia=BAJA
