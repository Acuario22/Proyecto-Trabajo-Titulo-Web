<div class="topbar-wrapper">
  <!-- Zona superior de desenfoque / blur en el espacio sobre la cápsula -->
  <div class="topbar-blur-zone" aria-hidden="true"></div>

  <!-- Cápsula flotante 100% opaca y simétrica -->
  <header class="topbar-capsule">
    <!-- Lado Izquierdo: Brand o Botón Volver + Título -->
    <div class="topbar-left">
      @if (mostrarVolver) {
        <button class="btn-back" (click)="onVolver()" type="button" [attr.aria-label]="textoVolver">
          <svg class="chevron-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>{{ textoVolver }}</span>
        </button>
        <span class="topbar-divider">·</span>
      }

      @if (mostrarIconoMunicipalidad && !mostrarVolver) {
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z" />
          </svg>
        </div>
      }

      <div class="brand-text">
        <span class="brand-title">{{ titulo }}</span>
        @if (subtitulo) {
          <span class="brand-subtitle">{{ subtitulo }}</span>
        }
      </div>
    </div>

    <!-- Lado Derecho: Estado del sistema / Perfil / Proyección de contenido -->
    <div class="topbar-right">
      <ng-content></ng-content>

      @if (perfilTexto) {
        <div class="profile-pill">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span>{{ perfilTexto }}</span>
        </div>
      }

      @if (mostrarEstado) {
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">{{ textoEstado }}</span>
        </div>
      }
    </div>
  </header>
</div>
